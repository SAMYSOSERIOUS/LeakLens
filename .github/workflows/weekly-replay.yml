# The "live business" job. Every Monday it feeds in the next month of history,
# scores every customer, checks earlier predictions, retrains if accuracy fell
# below the floor, then publishes the monitor page.
#
# It needs the real KKBox data, which is too big for the repo. Upload the
# output of `make prepare` (the data/kkbox/prepared folder) as a .tar.gz
# somewhere private and add its download link as the repository secret
# PREPARED_DATA_URL. Without that secret the job skips itself, so the page keeps
# the last real snapshot committed from a local run.

name: weekly replay

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.check.outputs.ran }}
    steps:
      - id: check
        env:
          PREPARED_DATA_URL: ${{ secrets.PREPARED_DATA_URL }}
        run: |
          if [ -n "$PREPARED_DATA_URL" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PREPARED_DATA_URL is not set - skipping the replay (see README)."
          fi

      - if: steps.check.outputs.ran == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ran == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.check.outputs.ran == 'true'
        run: pip install -e .

      - name: Get the prepared KKBox data
        if: steps.check.outputs.ran == 'true'
        env:
          PREPARED_DATA_URL: ${{ secrets.PREPARED_DATA_URL }}
        run: |
          mkdir -p data/kkbox/prepared
          curl -sSfL "$PREPARED_DATA_URL" | tar -xz -C data/kkbox/prepared

      - name: Run one month of the replay
        if: steps.check.outputs.ran == 'true'
        run: python -m leaklens replay-step

      - name: Save state and monitor data
        if: steps.check.outputs.ran == 'true'
        run: |
          git config user.name "leaklens-bot"
          git config user.email "leaklens-bot@users.noreply.github.com"
          git add state site/data
          git commit -m "weekly replay: $(python -c "import json;print(json.load(open('state/replay_state.json'))['today'])")" || echo "nothing to commit"
          git push

      - if: steps.check.outputs.ran == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: replay
    if: needs.replay.outputs.ran == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
