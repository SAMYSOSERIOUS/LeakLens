# The "live business" job. Every Monday it feeds in the next month of history,
# scores every customer, checks last months' predictions, retrains if accuracy
# fell below the floor, then publishes the monitor page.
#
# Data: by default it uses the made-up sample (rebuilt in ~1 minute, same seed
# every time). To run on real KKBox data, upload the output of `make prepare`
# as a .tar.gz somewhere private and add its download link as the repository
# secret PREPARED_DATA_URL. The job then uses that instead.

name: weekly replay

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .

      - name: Get data
        env:
          PREPARED_DATA_URL: ${{ secrets.PREPARED_DATA_URL }}
        run: |
          if [ -n "$PREPARED_DATA_URL" ]; then
            mkdir -p data/kkbox/prepared
            curl -sSfL "$PREPARED_DATA_URL" | tar -xz -C data/kkbox/prepared
            sed -i 's#^prepared_dir = .*#prepared_dir = "data/kkbox/prepared"#; s#^is_sample = .*#is_sample = false#' config.toml
          else
            python -m leaklens make-sample
          fi

      - name: Run one month of the replay
        run: python -m leaklens replay-step

      - name: Save state and monitor data
        run: |
          git config user.name "leaklens-bot"
          git config user.email "leaklens-bot@users.noreply.github.com"
          git add state site/data
          git commit -m "weekly replay: $(python -c "import json;print(json.load(open('state/replay_state.json'))['today'])")" || echo "nothing to commit"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: replay
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
